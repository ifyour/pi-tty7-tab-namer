name: Publish to npm

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC for npm trusted publishing
      contents: write # create GitHub Release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - name: Install pi # e2e test (npm test) spawns it
        run: npm install -g @earendil-works/pi-coding-agent
      - name: Upgrade npm # trusted publishing (OIDC) requires npm >= 11.5.1; Node 22 ships 10.x
        run: npm install -g npm@latest
      - run: npm test
      - run: npm publish --access public
      - name: Extract changelog for this version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          awk -v ver="$VERSION" '/^## /{p=0} $0 ~ "^## ?"ver" "{p=1} p' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "No changelog section for $VERSION" >&2; exit 1; }
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body_path: release-notes.md
